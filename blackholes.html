  <canvas id="starfield"></canvas>
  <section id="galaxies-screen" class="page active">
    <h1>Blackholes</h1>
    <div id="gallery" aria-label="Galaxy Image Gallery">
      </div>
  </section>

  <div id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div id="modal-content">
      
      <img id="modal-image" alt="Data image" style="display: none; width: 100%; border-radius: 8px; margin-bottom: 15px;" />
      
      <div id="canvas-container" style="display: none; width: 100%; height: 350px; cursor: grab;"></div>
      
      <h2 id="modal-title"></h2>
      <p><strong>Astronomical Designation:</strong> <span id="modal-designation"></span></p>
      <p><strong>Morphology/Type:</strong> <span id="modal-morphology"></span></p>
      <p><strong>Distance from Earth:</strong> <span id="modal-distance"></span></p>
      <p id="modal-description"></p>
      <button id="back-button" aria-label="Close information panel">Close</button>
    </div>
  </div>

  <script src="script.js"></script>
